# Xcode-Projekt für die Apple-TV-App erzeugen (einmalig, auf dem Mac):
#   brew install xcodegen
#   cd appletv && xcodegen
#   open HausDashboard.xcodeproj
# Danach in Xcode unter „Signing & Capabilities“ dein Team (Apple-ID) wählen
# und den Bundle Identifier bei Bedarf eindeutig machen (z. B. de.<name>.hausdashboard).
name: HausDashboard
options:
  bundleIdPrefix: de.energiebridge
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HausDashboard:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: HausDashboard
    info:
      path: HausDashboard/Info.plist
      properties:
        CFBundleDisplayName: Haus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIRequiredDeviceCapabilities: [arm64]
        # the bridge speaks plain HTTP in the home network. Only this key: with
        # NSAllowsLocalNetworking added, tvOS would ignore NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Die App liest die Werte deiner Energie-Bridge im Heimnetz.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.energiebridge.hausdashboard.tv
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
